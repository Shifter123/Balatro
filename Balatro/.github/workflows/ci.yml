name: CI Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_PRESETS: "linuxbsd"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Git LFS
        uses: git-lfs/git-lfs-action@v3
        with:
          install: true

      - name: Get Godot
        run: |
          curl -L https://github.com/精华去水的GodotBuilds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip -o godot.zip
          unzip -o godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          mv Godot_v4.2.2-stable_linux.x86_64 /home/runner/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Validate project
        run: |
          godot --headless --quit --validate-extension-api 2>&1 || true

      - name: Build Export Templates
        run: |
          mkdir -p build
          godot --headless --export-release "Linux" build/game
        continue-on-error: true

      - name: Upload Linux Build
        if: env.CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/game
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GDScript formatter
        run: pip install gdlint

      - name: Run linter
        run: |
          find . -name "*.gd" -exec gdlint {} \;
        continue-on-error: true
